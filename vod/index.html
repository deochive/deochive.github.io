<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOD</title>
    <meta
      name="description"
      content="A BruceDropEmOff Stream Archive — a searchable archive of BruceDropEmOff VODs. Sort by date, length, title, or creator, view watch history, and browse available streams uploaded on YouTube through embeds."
    />
    <link
      rel="icon"
      type="image/png"
      href="../images/icons/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../images/small-logo.ico/favicon.svg"
    />
    <link rel="shortcut icon" href="../images/small-logo.ico/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../images/small-logo.ico/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="DEOchive" />
    <link rel="manifest" href="../images/small-logo.ico/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link
      rel="preload"
      href="../body.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link rel="stylesheet" href="../body.css" />
    </noscript>
    <link
      rel="preload"
      href="../vod-style-MP.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link rel="stylesheet" href="../vod-style-MP.css" />
    </noscript>
    <link
      rel="preload"
      href="./vod-style-VP.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
    <link rel="stylesheet" href="./vod-style-VP.css" />
    </noscript>
    <link
      rel="preload"
      href="../live-style.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link rel="stylesheet" href="../live-style.css" />
    </noscript>
    <link rel="stylesheet" href="../themes.css" />
    </noscript>
    <link
      rel="preload"
      href="../themes.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link rel="stylesheet" href="../themes.css" />
    </noscript>
    <script src="../site-pref.js" defer></script>
    <script src="./video-page.js" defer></script>
    <script src="../vod-history.js" defer></script>
    <script src="../theatre-mode.js" defer></script>
    <script src="../live-detection.js" defer></script>
    <script src="./copy-url.js" defer></script>
  </head>
  <body>
    <header>
    <h1 class="scr-r-hidden">Video information page</h1>
    </header>
    <div class="controls-bar-wrapper">
      <div class="controls-bar">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="https://deochive.github.io">Home</a>
          <span aria-hidden="true">&gt;</span>
          <span>VOD</span>
        </nav>

        <a href="https://deochive.github.io" class="back-link-button">&lt; Back</a>
        <button id="theme-button">Toggle themes</button>
        <div id="theme-popup" class="popup">
          <button class="popup-option" data-theme="light">Light Mode</button>
          <button class="popup-option" data-theme="dark">Dark Mode</button>
          <br>
          <button class="popup-option" data-border="outline">
            Yellow theme (standard)
          </button>
          <button class="popup-option" data-border="animated">
            Hell theme
          </button>
        </div>
        <button id="theatre-toggle">Theatre Mode</button>
      </div>
    </div>
    <main id="video-container"></main>
    <script>
      (() => {
        const controls = document.querySelector(".controls-bar");
        if (!controls) return;

        const updateShrink = () => {
          controls.classList.toggle(
            "shrink",
            controls.getBoundingClientRect().top <= 25,
          );
        };

        window.addEventListener("scroll", updateShrink, { passive: true });
        updateShrink();
      })();
    </script>
  <script>
    const allowedHost = "deochive.github.io";
    if (window.location.hostname !== allowedHost) {
      window.location.href = "https://deochive.github.io";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('videoId');
    const validVideoIdPattern = /^[a-zA-Z0-9_-]{11}$/;
    if (!videoId || !validVideoIdPattern.test(videoId)) {
      window.location.href = "https://deochive.github.io";
    }
  </script>
  </body>
</html>
